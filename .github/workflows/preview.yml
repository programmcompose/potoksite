name: Deploy preview

on:
  push:
    branches:
      - preview/student-ux
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Point site_url at /preview
        run: |
          python -c "from pathlib import Path; p = Path('mkdocs.yml'); t = p.read_text(encoding='utf-8'); t = t.replace('site_url: \"https://programmcompose.github.io/potoksite\"', 'site_url: \"https://programmcompose.github.io/potoksite/preview\"'); p.write_text(t, encoding='utf-8')"

      - name: Build site
        run: mkdocs build --strict

      - name: Deploy preview folder
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: preview
          keep_files: true
